<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Checkout — AFTER PARTY</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Fraunces&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0B0B0C; --surface:#171718; --text:#F5F0E6; --muted:#B8B3AA; --accent:#FFE600; --line:rgba(245,240,230,.16); --display:"Bricolage Grotesque", sans-serif; --body:"Fraunces", serif;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--body); padding-bottom:60px}
  .wrap{max-width:640px; margin-inline:auto; padding-inline:20px}
  header{padding:20px 0; border-bottom:1px solid var(--line); margin-bottom:40px}
  .box{border:1px solid var(--line); border-radius:18px; background:var(--surface); padding:32px}
  .field{margin-bottom:18px; display:grid; gap:6px}
  label{font-family:var(--display); font-size:0.8rem; color:var(--muted); letter-spacing:0.05em}
  input, select, textarea{width:100%; padding:12px; border-radius:8px; border:1px solid var(--line); background:#000; color:#fff; font-family:inherit; box-sizing:border-box}
  .btn{font-family:var(--display); font-weight:800; padding:14px; border-radius:99px; background:var(--accent); color:#000; border:none; width:100%; cursor:pointer; font-size:1rem; margin-top:10px}
  .btn:hover{opacity:0.9}
</style>
</head>
<body>

<header>
  <div class="wrap" style="display:flex; justify-content:space-between; align-items:center;">
    <a href="/" style="font-family:var(--display); font-weight:800; font-size:1.3rem; color:var(--accent); text-decoration:none;">AFTER PARTY</a>
    <a href="/shop" style="color:var(--muted); text-decoration:none; font-family:var(--display);">Back to Shop</a>
  </div>
</header>

<main class="wrap">
  <div class="box">
    <h1 style="font-family:var(--display); margin-bottom:8px;">Complete Order</h1>
    <p style="color:var(--muted); margin-bottom:24px;">Direct dispatch via quick-commerce network.</p>

    <form onsubmit="alert('Order submitted successfully!'); return false;">
      <div class="field">
        <label>SELECTED ITEM / PACK</label>
        <input type="text" id="orderItem" value="Standard Pack" readonly style="color:var(--accent); font-weight:bold;" />
      </div>
      <div class="field">
        <label>FULL NAME</label>
        <input type="text" placeholder="Enter full name" required />
      </div>
      <div class="field">
        <label>DELIVERY ADDRESS</label>
        <textarea rows="3" placeholder="Flat, building, or area name" required></textarea>
      </div>
      <div class="field">
        <label>PAYMENT METHOD</label>
        <select>
          <option>Instant UPI / QR</option>
          <option>Credit or Debit Card</option>
          <option>Cash on Delivery</option>
        </select>
      </div>
      <button class="btn" type="submit">Place Order</button>
    </form>
  </div>
</main>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const item = urlParams.get('item') || urlParams.get('pack');
  if (item) {
    document.getElementById('orderItem').value = item.replace('-', ' ').toUpperCase();
  }
</script>

</body>
</html>
